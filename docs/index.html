:root{--bg:#fcf7f2;--ink:#4e342c;--green:#a35f49;--muted:#866f65;--line:#eadcd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a35f49;outline-offset:4px}button{border:0;border-radius:14px;background:white;color:var(--ink);padding:14px 18px}header{max-width:1120px;margin:auto;padding:27px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-1px}.brand b{font-size:25px;margin-right:10px}.small{font-size:13px;color:var(--muted)}.badge{font-size:11px;letter-spacing:1px;background:#f3e4d9;border-radius:20px;padding:6px 12px}main{max-width:1060px;margin:auto;padding:42px 28px 100px}.eyebrow{font-size:12px;letter-spacing:2px;color:#866f65;font-weight:700}h1{font-size:44px;line-height:1.3;letter-spacing:-2px;font-weight:650;margin:15px 0}h2{font-size:23px;letter-spacing:-.8px;margin:0 0 9px}p{margin:10px 0}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:50px;align-items:center;margin-bottom:38px}.leaf{position:absolute;right:24px;top:18px;font-size:55px;opacity:.25;transform:rotate(-20deg)}.feature{background:var(--green);color:#fff;border-radius:25px;padding:29px;position:relative;overflow:hidden}.feature p{color:#f9e8df}.primary{background:var(--green);color:white;font-weight:700}.feature button{width:100%;margin-top:19px;font-weight:700;background:#f3e4d9}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:6px;background:#eadcd2;border-radius:10px;margin:14px 0}.progress i{display:block;height:100%;background:#a35f49;border-radius:10px}.stats{background:#f3e4d9;border-radius:17px;padding:20px 24px;margin-bottom:34px}.section{margin:30px 0 ing:30px}.footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;font-size:12px;color:#866f65}.pill{border:1px solid var(--line);font-size:12px;padding:5px 10px;border-radius:15px}.hide{display:none}@media(max-width:650px){header{padding:18px 20px}header .small{display:none}main{padding:27px 20px 70px}.hero{grid-template-columns:1fr;gap:23px}h1{font-size:35px}.feature{padding:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:18px 15px}.card strong{font-size:16px}.panel{padding:22px 18px}.verse{font-size:23px}.stats{padding:18px}.bottom{flex-wrap:wrap}.bottom button{flex:1}.row{flex-wrap:wrap}.badge{font-size:10px}.icon{margin-bottom:12px}}

</style></head><body><header><button type="button" class="brand" aria-label="말씀 한 걸음 홈으로" onclick="go('home')"><svg class="brand-book" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8c-4-3-9-3-13-2v20c5-1 9-1 13 2 4-3 8-3 13-2V6c-4-1-9-1-13 2Z"/><path d="M16 8v20M9 10v9M6.5 13h5M20 12h5M20 16h5M20 20h5"/></svg>말씀 한 걸음</button><span class="small">매일 조금씩, 마음에 새기는 말씀</span><span class="badge">골로새서 3장</span></header><main id="app"></main><script>
const sample='이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라';const $=s=>document.querySelector(s);const app=$('#app');let verses=[{"n": 1, "text": "그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위의 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라"}, {"n": 2, "text": "위의 것을 생각하고 땅의 것을 생각하지 말라"}, {"n": 3, "text": "이는 너희가 죽었고 너희 생명이 그리스도와 함께 하나님 안에 감추어졌음이라"}, {"n": 4, "text": "우리 생명이신 그리스도께서 나타나실 그 때에 너희도 그와 함께 영광 중에 나타나리라"}, {"n": 5, "text": "그러므로 땅에 있는 지체를 죽이라 곧 음란과 부정과 사욕과 악한 정욕과 탐심이니 탐심은 우상 숭배니라"}, {"n": 6, "text": "이것들로 말미암아 하나님의 진노가 임하느니라"}, {"n": 7, "text": "너희도 전에 그 가운데 살 때에는 그 가운데서 행하였으나"}, {"n": 8, "text": "이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라"}, {"n": 9, "text": "너희가 서로 거짓말을 하지 말라 옛 사람과 그 행위를 벗어 버리고"}, {"n": 10, "text": "새 사람을 입었으니 이는 자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 입은 자니라"}, {"n": 11, "text": "거기에는 헬라인이나 유대인이나 할례파나 무할례파나 야만인이나 스구디아인이나 종이나 자유인이 차별이 있을 수 없나니 오직 그리스도는 만유시요 만유 안에 계시니라"}, {"n": 12, "text": "그러므로 너희는 하나님이 택하사 거룩하고 사랑 받는 자처럼 긍휼과 자비와 겸손과 온유와 오래 참음을 옷 입고"}, {"n": 13, "text": "누가 누구에게 불만이 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것 같이 너희도 그리하고"}, {"n": 14, "text": "이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라"}, {"n": 15, "text": "그리스도의 평강이 너희 마음을 주장하게 하라 너희는 평강을 위하여 한 몸으로 부르심을 받았나니 너희는 또한 감사하는 자가 되라"}, {"n": 16, "text": "그리스도의 말씀이 너희 속에 풍성히 거하여 모든 지혜로 피차 가르치며 권면하고 시와 찬송과 신령한 노래를 부르며 감사하는 마음으로 하나님을 찬양하고"}, {"n": 17, "text": "또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라"}],progress={},mode='home',idx=0,range='all',sub='word',hint=0,answered=false,ordered=[],queue=null,blankType='word',readAll=false,readLarge=false;try{verses=JSON.parse(localStorage.getItem('verses-v2'))||verses;progress=JSON.parse(localStorage.getItem('progress-v2'))||{}}catch(e){}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('progress-v2',JSON.stringify(progress))}catch(e){}}function list(){if(queue)return queue;return verses.filter(v=>range==='all'||(range==='weak'?progress[v.n]?.weak:range.split('-').map(Number).length&&v.n>=+range.split('-')[0]&&v.n<=+range.split('-')[1]))}function mark(weak=false){let v=list()[idx];if(v){progress[v.n]={practiced:true,weak,memorized:(progress[v.n]?.memorized||mode==='recite'&&!weak)};save()}}function go(m){queue=null;const selection=list();queue=selection.slice();mode=m;idx=0;hint=0;answered=false;ordered=[];render();window.scrollTo(0,0)}const modes=[['read','▤','본문 읽기','천천히 읽으며 익혀요'],['quiz','①','사지선다','이어질 말을 골라요'],['blank','▱','빈칸 채우기','기억 속 단어를 꺼내요'],['order','⇄','순서 맞추기','말씀의 흐름을 이어요'],['recite','◌','가리고 암송','힌트 없이 도전해요'],['write','✎','쓰기 연습','한 절씩 직접 써봐요']];function render(){if(mode==='home'){let done=verses.filter(v=>progress[v.n]?.practiced).length;app.innerHTML=`<div class="hero"><div><div class="eyebrow">COLOSSIANS 3:1–17</div><h1>한 절씩, 천천히.<br>말씀이 마음에 머물도록.</h1><p class="muted">골로새서 3장 1–17절 암송 여정<br>11월 15일 추수감사절을 함께 준비해요.</p></div><div class="feature"><span class="leaf">❧</span><span class="small" style="color:#f9e8df">오늘의 작은 실천</span><h2 style="margin-top:14px">읽고, 기억하고, 새기기</h2><p>하루 5분, 한 절부터 시작해 보세요.</p><button onclick="range='all';go('read')">오늘의 연습 시작 <span style="float:right">→</span></button></div></div><div class="stats"><div class="row"><strong>나의 암송 여정</strong><span class="small">${done} / ${verses.length}절 연습</span></div><div class="progress"><i style="width:${done/verses.length*100}%"></i></div><div class="row"><span class="small">작은 반복이 쌓여, 오래 남는 말씀이 돼요.</span><button style="padding:4px 0;background:transparent;font-size:12px" onclick="range='weak';go('read')">어려웠던 절 복습 →</button></div></div><div class="row section"><h2>나에게 맞는 방법으로</h2><span class="tag">6가지 연습</span></div><div class="cards">${modes.map(([m,i,t,d])=>`<button class="card" onclick="range='all';go('${m}')"><span class="icon">${i}</span><strong>${t}</strong><span>${d}</span></button>`).join('')}</div><div class="section row"><div><strong>함께 외울 말씀</strong><div class="small">개역개정 · 골로새서 3장</div></div><button class="outline" onclick="go('settings')">본문 설정 ↗</button></div><p class="notice">${verses.length===1?'체험용 프로토타입 · 현재 14절 예시가 들어 있어요. 교회에서 받은 본문을 등록하면 1–17절을 연습할 수 있어요.':'교회 암송 본문 · 개역개정 골로새서 3:1–17 · 11월 15일 추수감사절'}</p><div class="footer">말씀 한 걸음 &nbsp;·&nbsp; 진도는 현재 브라우저에 저장돼요.</div>`;return}if(mode==='settings'){app.innerHTML=`<button class="back" onclick="go('home')">← 처음으로</button><h1>함께 외울 말씀</h1><p class="muted">교회에서 받은 개역개정 본문을 붙여 넣어 주세요.<br>각 절을 새 줄에서 절 번호와 함께 시작해 주세요.</p><div class="panel"><label for="source">골로새서 3장 · 본문 입력</label><textarea id="source" style="min-height:330px" placeholder="1 본문…&#10;2 본문…">${verses.length>1?esc(verses.map(v=>v.n+' '+v.text).join('\n')):''}</textarea><p class="small">입력한 본문은 이 브라우저에만 저장됩니다. 같은 절 번호는 한 번만 입력해 주세요.</p><div id="msg" role="status"></div><button class="primary" onclick="importText()">본문 저장하고 연습하기</button></div>`;return}const arr=list(),v=arr[idx];app.innerHTML=`<button class="back" onclick="go('home')">← 처음으로</button><div class="row"><h2>${modes.find(x=>x[0]===mode)[2]}</h2><span class="pill">${mode==='read'&&readAll?'전체 '+arr.length+'절':(arr.length?idx+1:0)+' / '+arr.length}</span></div><div class="toolbar"><select aria-label="연습 범위" onchange="range=this.value;queue=null;queue=list().slice();idx=0;render()">${[['all','전체 범위'],['1-4','1–4절'],['5-11','5–11절'],['12-14','12–14절'],['15-17','15–17절'],['weak','어려웠던 절']].map(([a,b])=>`<option value="${a}" ${range===a?'selected':''}>${b}</option>`).join('')}</select></div>${mode==='read'&&readAll?'':`<div class="progress"><i style="width:${arr.length?(idx+1)/arr.length*100:0}%"></i></div>`}<div id="exercise"></div>`;if(!v){$('#exercise').innerHTML=`<div class="panel empty"><h2>아직 연습할 절이 없어요</h2><p class="muted">${range==='weak'?'어려웠던 절을 표시하면 여기에서 모아볼 수 있어요.':'본문 설정에서 이 범위의 말씀을 추가해 주세요.'}</p><button onclick="go('settings')">본문 설정</button></div>`;return}answered=false;let words=v.text.split(/\s+/),cut=Math.max(1,Math.floor(words.length*.45)),target=words[cut],body='';if(mode==='read')body=`<div class="toolbar"><button class="${!readAll?'active':''}" aria-pressed="${!readAll}" onclick="readAll=false;render()">한 절씩 읽기</button><button class="${readAll?'active':''}" aria-pressed="${readAll}" onclick="readAll=true;render()">선택 범위 전체 읽기</button></div><div class="row"><span class="small">소리 내어 천천히 읽어 보세요</span><div class="font-controls" role="group" aria-label="글씨 크기"><button id="font-smaller" aria-label="글씨 작게" onclick="setReadingSize(false)" ${!readLarge?'disabled':''}>가 −</button><button id="font-larger" aria-label="글씨 크게" onclick="setReadingSize(true)" ${readLarge?'disabled':''}>가 +</button></div></div><div class="verse" id="reading-verse" style="${readLarge?'font-size:30px':''}">${readAll?arr.map(x=>`<p><small>${x.n}절</small>${esc(x.text)}</p>`).join(''):esc(v.text)}</div>`;
if(mode==='quiz'){let phrase=sub==='phrase',answer=phrase?words.slice(cut).join(' '):target;let pool=phrase?verses.filter(x=>x.n!==v.n).map(x=>{let w=x.text.split(/\s+/);return w.slice(Math.floor(w.length*.45)).join(' ')}):verses.flatMap(x=>x.text.split(/\s+/));pool=[...new Set(pool)].filter(x=>x!==answer).sort(()=>Math.random()-.5);let options=[answer,...pool.slice(0,3)].sort(()=>Math.random()-.5);body=`<div class="toolbar"><button class="${!phrase?'active':''}" onclick="sub='word';render()">다음 단어</button><button class="${phrase?'active':''}" onclick="sub='phrase';render()">다음 구절</button></div><p class="small">다음에 이어질 ${phrase?'구절':'단어'}을 골라 주세요.</p><p class="verse">${esc(words.slice(0,cut).join(' '))} <span class="ghost"> · · · </span></p><div class="choices">${options.map(o=>`<button class="choice" data-correct="${o===answer}" onclick="choose(this)">${esc(o)}</button>`).join('')}</div>`}
if(mode==='blank')body=`<div class="toolbar"><button class="${blankType==='word'?'active':''}" onclick="blankType='word';render()">단어 빈칸</button><button class="${blankType==='verse'?'active':''}" onclick="blankType='verse';render()">한 절 빈칸</button></div><p class="small">${blankType==='word'?'빈칸에 들어갈 단어를 직접 써보세요.':'첫 어절을 힌트로 한 절 전체를 써보세요.'}</p>${blankType==='verse'?`<p class="verse">${esc(words[0])} …</p><textarea maxlength="2000" id="answer" aria-label="한 절 전체 쓰기" placeholder="첫 어절부터 전체 말씀을 입력해 주세요"></textarea>`:`<p class="verse">${esc(words.slice(0,cut).join(' '))} <input class="blank" id="answer" aria-label="빠진 단어" autocomplete="off"> ${esc(words.slice(cut+1).join(' '))}</p>`}<button class="outline" onclick="checkBlank()">정답 확인</button>`;
if(mode==='recite')body=`<p class="small">말씀을 보지 않고 소리 내어 외워 보세요.</p><p class="verse">${hint===2?esc(v.text):hint===1?esc(words[0])+' '+words.slice(1).map(w=>'●'.repeat(w.length)).join(' '):'<span class="ghost">마음에 새긴 말씀을 꺼내 보세요.</span>'}</p><div class="toolbar"><button onclick="hint=1;render()">첫 어절 힌트</button><button onclick="hint=hint===2?0:2;render()">${hint===2?'다시 가리기':'본문 확인'}</button></div><div class="bottom"><button class="outline" onclick="mark(true);next()">다시 연습할래요</button><button class="primary" onclick="mark(false);next()">혼자 외웠어요 ✓</button></div>`;
if(mode==='write')body=`<p class="small">기억나는 말씀을 써보세요. 띄어쓰기와 문장부호는 채점에서 제외해요.</p><textarea maxlength="2000" id="answer" placeholder="여기에 말씀을 써보세요…" aria-label="암송 본문 쓰기"></textarea><div class="bottom"><button class="outline" onclick="$('#reference').classList.toggle('hide')">본문 보기</button><button class="primary" onclick="checkWrite()">원문과 비교</button></div><p id="reference" class="hide">${esc(v.text)}</p>`;
if(mode==='order'){let chunks=[];for(let i=0;i<words.length;i+=3)chunks.push(words.slice(i,i+3).join(' '));ordered=[];body=`<p class="small">구절을 차례로 눌러 말씀을 완성해 보세요.</p><div class="verse" id="ordered" style="min-height:100px;background:#fcf7f2;padding:15px;border-radius:12px">아래 구절을 눌러 주세요</div><div class="chips">${chunks.map((t,i)=>({t,i})).reverse().map(({t,i})=>`<button data-order="${i}" onclick="orderPick(this)">${esc(t)}</button>`).join('')}</div><button class="outline" onclick="render()">다시 배치하기</button>`}
$('#exercise').innerHTML=`<div class="panel"><div class="eyebrow">골로새서 3장 ${mode==='read'&&readAll?'선택 범위 전체':v.n+'절'} · 개역개정</div>${body}<div id="feedback" class="feedback" role="status"></div></div><div class="bottom">${mode==='read'&&readAll?`<button class="primary" onclick="finishReadingAll()">전체 읽기 완료 ✓</button>`:`<button class="outline" onclick="idx=Math.max(0,idx-1);hint=0;render()">이전 절</button><button class="primary" onclick="advanceVerse()">${idx===arr.length-1?(mode==='read'?'읽기 완료 ✓':'연습 마치기'):'다음 절 →'}</button>`}</div>`}
function setReadingSize(large){readLarge=large;$('#reading-verse').style.fontSize=large?'30px':'';$('#font-smaller').disabled=!large;$('#font-larger').disabled=large}
function finishReadingAll(){for(const v of list()){progress[v.n]={...progress[v.n],practiced:true}}save();idx=list().length-1;next()}
function advanceVerse(){if(mode==='read'&&!readAll){const v=list()[idx];if(v){progress[v.n]={...progress[v.n],practiced:true};save()}}next()}
function next(){if(idx<list().length-1){idx++;hint=0;render()}else{app.innerHTML=`<button class="back" onclick="go('home')">← 처음으로</button><div class="panel empty"><div style="font-size:55px">❧</div><div class="eyebrow">ONE STEP CLOSER</div><h1>오늘도 한 걸음.</h1><p class="muted">말씀을 마음에 새기는 시간을 가졌어요.<br>한 번 더 반복하면 더 익숙해질 거예요.</p><div class="bottom"><button class="outline" onclick="go('home')">처음으로</button><button class="primary" onclick="go(mode==='read'?'quiz':mode==='quiz'?'blank':mode==='blank'?'recite':'read')">다음 연습으로 →</button></div></div>`}}
function choose(el){if(answered)return;answered=true;let ok=el.dataset.correct==='true';el.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-correct="true"]').forEach(b=>b.classList.add('correct'));$('#feedback').textContent=ok?'맞았어요! 다음에도 기억해 보세요.':'괜찮아요. 초록색 정답을 다시 읽어 보세요.';mark(!ok)}const norm=s=>s.replace(/[\s\p{P}]/gu,'');function checkBlank(){if(blankType==='verse'){checkWrite();return}let w=list()[idx].text.split(/\s+/),a=w[Math.max(1,Math.floor(w.length*.45))],ok=norm($('#answer').value)===norm(a);$('#feedback').textContent=ok?'정답이에요!':'정답은 “'+a+'”이에요.';mark(!ok)}function diffText(input,expected){let a=Array.from(norm(input).slice(0,2000)),b=Array.from(norm(expected)),dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);let keep=new Set(),i=a.length,j=b.length;while(i&&j){if(a[i-1]===b[j-1]){keep.add(--j);i--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}let k=0;return Array.from(expected).map(c=>!norm(c)?esc(c):keep.has(k++)?esc(c):'<mark>'+esc(c)+'</mark>').join('')}function checkWrite(){let text=list()[idx].text,ok=norm($('#answer').value)===norm(text);$('#feedback').innerHTML=ok?'정확하게 썼어요!':`원문과 다른 부분이 있어요. 다시 비교해 보세요.<p style="font-weight:400">${diffText($('#answer').value,text)}</p><span class="small">표시된 부분은 빠졌거나 다르게 쓴 원문입니다.</span>`;mark(!ok)}function orderPick(b){if(b.disabled)return;b.disabled=true;b.style.opacity='.35';ordered.push({i:+b.dataset.order,t:b.textContent});$('#ordered').textContent=ordered.map(x=>x.t).join(' ');if(ordered.length===document.querySelectorAll('[data-order]').length){let ok=ordered.every((x,i)=>x.i===i);$('#feedback').textContent=ok?'말씀을 바른 순서로 연결했어요!':'순서가 조금 달라요. 다시 배치해 보세요.';mark(!ok)}}function importText(){let raw=$('#source').value.trim(),lines=raw.split(/\n+/),out=[];for(let line of lines){let m=line.trim().match(/^(\d{1,2})[.\s:]+(.+)$/);if(!m||+m[1]<1||+m[1]>17||out.some(v=>v.n===+m[1])){$('#msg').textContent='각 줄을 1~17의 절 번호와 본문으로 입력해 주세요. 중복 번호는 사용할 수 없어요.';return}out.push({n:+m[1],text:m[2]})}if(!out.length)return;verses=out.sort((a,b)=>a.n-b.n);progress={};try{localStorage.setItem('verses-v2',JSON.stringify(verses));save()}catch(e){}range='all';go('home')}render();
</script></body></html>
